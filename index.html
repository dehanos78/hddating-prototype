<title>Designdate</title>
<style>
  :root { --paper: #F4F1EA; --ink: #1E1F1C; --muted: #5B5A54; --line: #D9D4C7; --accent: #B9843A; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: "Inter", system-ui, sans-serif; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  form { width: min(360px, 100%); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 28px 0; display: grid; gap: 14px; }
  h1 { margin: 0; font-family: "Fraunces", Georgia, serif; font-weight: 300; font-size: 30px; letter-spacing: -0.01em; text-transform: lowercase; display: flex; align-items: center; gap: 10px; }
  h1::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  input[type=password] { font: inherit; font-size: 16px; padding: 10px 0; border: 0; border-bottom: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 0; }
  label.keep { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  label.keep input { accent-color: var(--ink); }
  button { font: inherit; font-weight: 500; font-size: 13px; letter-spacing: 0.04em; border: 1px solid var(--ink); padding: 11px 18px; background: var(--ink); color: var(--paper); cursor: pointer; justify-self: start; }
  button[disabled] { opacity: .6; }
  .err { color: #8C3B2E; font-size: 14px; min-height: 1.2em; }
</style>

<body>
<form id="f" autocomplete="off">

  <input type="password" id="pw" placeholder="Wachtwoord" autocomplete="current-password" required>

  <button type="submit" id="go">Openen</button>
  <div class="err" id="err" role="alert"></div>
</form>

  const KEY = "hddating-proto-key";
  const u8 = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(P.iv) }, key, u8(P.data));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }
  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: u8(P.salt), iterations: P.it }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  (async () => {
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (!saved) return;
    try { await open(await crypto.subtle.importKey("raw", u8(saved), "AES-GCM", false, ["decrypt"])); }
    catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} }
  })();
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("go"), err = document.getElementById("err");
    err.textContent = ""; btn.disabled = true; btn.textContent = "Bezig met openen…";
    try {
      const key = await derive(document.getElementById("pw").value);
      if (document.getElementById("keep").checked) {

      btn.disabled = false; btn.textContent = "Openen";
