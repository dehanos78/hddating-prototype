  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(60vmax 60vmax at 10% 0%, #FFD9C2 0%, transparent 55%), radial-gradient(50vmax 50vmax at 95% 30%, #CDEBEC 0%, transparent 55%), var(--bg); color: var(--ink);

  h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 8px; }

  const KEY = "hddating-proto-key";
  const u8 = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(P.iv) }, key, u8(P.data));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }
  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: u8(P.salt), iterations: P.it }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  (async () => {
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (!saved) return;
    try { await open(await crypto.subtle.importKey("raw", u8(saved), "AES-GCM", false, ["decrypt"])); }
    catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} }
  })();
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("go"), err = document.getElementById("err");
    err.textContent = ""; btn.disabled = true; btn.textContent = "Bezig met openen…";
    try {
      const key = await derive(document.getElementById("pw").value);
      if (document.getElementById("keep").checked) {
        try { const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key)); localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e2) {}
      }
      await open(key);
    } catch (ex) {
      err.textContent = "Dat wachtwoord klopt niet.";
      btn.disabled = false; btn.textContent = "Openen";
    }
  });
})();
